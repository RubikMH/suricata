# Splunk Universal Forwarder input for Suricata EVE JSON.
# Install on the SURICATA box at:
#   /opt/splunkforwarder/etc/apps/suricata_inputs/local/inputs.conf
# then: sudo /opt/splunkforwarder/bin/splunk restart
#
# Create the index "suricata" on your indexer first (or change index= below).

[monitor:///var/log/suricata/eve.json]
sourcetype = suricata
index = suricata
disabled = false

# Optional: Suricata's own engine log, useful for sensor health
[monitor:///var/log/suricata/suricata.log]
sourcetype = suricata:log
index = suricata
disabled = false
