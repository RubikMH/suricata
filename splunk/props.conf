# Parsing rules for the "suricata" sourcetype.
# Install on your INDEXERS (or heavy forwarder) at:
#   $SPLUNK_HOME/etc/apps/suricata_parsing/local/props.conf
#
# Not needed if you install the official "Splunk TA for Suricata"
# (recommended) — the TA ships equivalent settings plus CIM field mappings.

[suricata]
KV_MODE = json
INDEXED_EXTRACTIONS = none
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = \"timestamp\"\s*:\s*\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC

[suricata:log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_FORMAT = %d/%m/%Y -- %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 25
